<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.2/css/all.min.css" />
    <script src="script.js" defer></script>
</head>

<body>

    <h1>Music Player</h1>
    <div class="music-container" id="music-container">
        <div class="music-info">
            <h4 id="title"></h4>
            <!-- Progress Bar -->
            <div class="progress-container" id="progress-container">
                <div class="progress" id="progress"></div>
            </div>
    
        <!-- Current Time & Durration -->
        <div class="time-container">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
        </div>
     </div>

        <!-- Audio Element -->
        <audio id="audio" src="music/WeddingRing.mp3"></audio>

        <div class="img-container">
            <img src="images/WeddingRing.jpeg" alt="Album Cover" id="cover" />
        </div>

        <div class="navigation">
            <button id="prev" class="action-btn"><i class="fas fa-backward"></i></button>
            <button id="play" class="action-btn action-btn-big"><i class="fas fa-play"></i></button>
            <button id="next" class="action-btn"><i class="fas fa-forward"></i></button>
        </div>
    </div>
    <!--Shuffle / Rpeat Buttons-->
    <div class="extra-controls">
        <button id="shuffle" class="action-btn"><i class="fas fa-random"></i></button>
        <button id="repeat" class="action-btn"><i class="fas fa-redo"></i></button>
</div>
</body>

</html>
